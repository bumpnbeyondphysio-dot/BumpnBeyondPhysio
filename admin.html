<!DOCTYPE html>



<html>



<head>



<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">



<title>Bump N Beyond Physio — Admin</title>



<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>

let jitsiApi=null;

function openJitsi(id){
  const a=appts.find(x=>String(x.id)===String(id));
  if(!a||!a.meetingLink)return toast('Jitsi meeting link is not available yet.');
  // Open the actual Jitsi room in its own tab so the meeting can use the full browser window.
  // This runs directly from the Join button click, so popup blockers are less likely to block it.
  const meetingTab=window.open(a.meetingLink,'_blank');
  if(!meetingTab) toast('Your browser blocked the meeting tab. Allow pop-ups for this clinic site and click Join again.');
}

async function reviewManagement(){
  $('reviews').innerHTML='<div class="page-title"><div><h2>Review Management</h2><p>Publish, hide, delete and reply to patient reviews. Published replies appear on the website.</p></div><button class="secondary" onclick="reviewManagement()">↻ Refresh</button></div><div class="panel"><div class="loading-bar"></div></div>';
  try{
    const reviews=await run('getAdminReviews',token());
    window.reviewData=reviews||[];
    const statusPill=(st)=>{const x=String(st||'PENDING').toUpperCase();const cls=x==='APPROVED'?'green':x==='HIDDEN'?'gray':'yellow';return '<span class="pill '+cls+'">'+esc(x)+'</span>';};
    $('reviews').innerHTML=`<div class="page-title"><div><h2>Review Management</h2><p>Control what appears on the public website and reply directly to reviewers.</p></div><button class="secondary" onclick="reviewManagement()">↻ Refresh</button></div>
    <div class="panel"><div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center"><h3 style="margin:0">All Reviews</h3><small style="color:var(--muted)">${reviews.length} review(s)</small></div></div>
    <div class="review-admin-grid" style="margin-top:15px">${reviews.length?reviews.map(r=>`<article class="review-admin-card">
      <div class="review-admin-head"><div><b>${esc(r.name||'Anonymous')}</b><div class="review-meta">${esc(r.email||'No email')} · ${esc(r.phone||'')}<br>${esc(r.timestamp||'')}</div></div><div style="text-align:right">${statusPill(r.status)}<div class="review-admin-stars">${'★'.repeat(Math.max(0,Math.min(5,Number(r.rating)||0)))}</div></div></div>
      <div class="review-admin-review">${esc(r.review||'')}</div>
      ${r.attachmentUrl?`<a class="review-attachment-admin" href="${esc(r.attachmentUrl)}" target="_blank" rel="noopener">View attachment${r.attachmentName?' — '+esc(r.attachmentName):''}</a>`:''}
      ${r.reply?`<div class="review-admin-reply"><b>Clinic reply:</b><br>${esc(r.reply)}${r.replySentAt?`<div class="review-meta" style="margin-top:6px">Email: ${esc(r.replyEmailStatus||'')} · ${esc(r.replySentAt)}</div>`:''}</div>`:''}
      <div class="review-admin-actions">
        ${String(r.status).toUpperCase()!=='APPROVED'?`<button class="primary" onclick="setReviewVisibility('${esc(r.id)}','APPROVED')">✓ Display on Website</button>`:`<button class="secondary" onclick="setReviewVisibility('${esc(r.id)}','HIDDEN')">Hide from Website</button>`}
        ${String(r.status).toUpperCase()!=='PENDING'?`<button class="secondary" onclick="setReviewVisibility('${esc(r.id)}','PENDING')">Set Pending</button>`:''}
        <button class="secondary" onclick="openReviewReply('${esc(r.id)}')">${r.reply?'Edit / Resend Reply':'Reply & Publish'}</button>
        <button class="danger" onclick="deleteAdminReview('${esc(r.id)}')">Delete</button>
      </div>
    </article>`).join(''):'<div class="panel"><b>No reviews found.</b><p style="color:var(--muted);margin-bottom:0">New reviews submitted on the website will appear here as Pending.</p></div>'}</div>`;
  }catch(e){$('reviews').innerHTML='<div class="panel"><b>Unable to load reviews.</b><p style="color:#a83e3e">'+esc(e.message||'Please try again.')+'</p><button class="secondary" onclick="reviewManagement()">Try Again</button></div>';}
}

function openReviewReply(id){
  const r=(window.reviewData||[]).find(x=>String(x.id)===String(id)); if(!r)return toast('Review not found.');
  $('modalBox').innerHTML=`<div class="modal-head"><div><h3>${r.reply?'Edit / Resend Reply':'Reply to Review'}</h3><p style="margin:5px 0;color:var(--muted)">${esc(r.name)} · ${esc(r.email||'No email')}</p></div><button class="secondary" onclick="closeModal()">Close</button></div>
  <div class="panel" style="background:#f7fbfa"><b>Patient review</b><div style="margin-top:8px;white-space:pre-wrap;line-height:1.5">${esc(r.review)}</div></div>
  <div class="field" style="margin-top:14px"><label>Clinic reply</label><textarea id="reviewReplyText" class="reply-box" maxlength="5000" placeholder="Write a professional reply to the reviewer...">${esc(r.reply||'')}</textarea><small style="color:var(--muted)">Saving the reply will publish the review and email the reply to the reviewer.</small></div>
  <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:14px"><button class="secondary" onclick="closeModal()">Cancel</button><button class="primary" onclick="sendReviewReply('${esc(r.id)}')">${r.reply?'Save & Resend Reply':'Reply & Publish'}</button></div>`;
  $('modal').style.display='grid';
}

async function sendReviewReply(id){
  const reply=$('reviewReplyText').value.trim(); if(!reply)return toast('Please enter a reply.');
  try{const r=await run('replyToReview',token(),id,reply);closeModal();toast(r.message);await reviewManagement();}catch(e){toast(e.message||'Unable to send the review reply.');}
}

async function setReviewVisibility(id,status){
  try{const r=await run('setReviewStatus',token(),id,status);toast(r.message);await reviewManagement();}catch(e){toast(e.message||'Unable to update review.');}
}

async function deleteAdminReview(id){
  if(!confirm('Delete this review permanently? This cannot be undone.'))return;
  try{const r=await run('deleteReview',token(),id);toast(r.message);await reviewManagement();}catch(e){toast(e.message||'Unable to delete review.');}
}

async function treatmentPlans(){
  $('treatmentPlans').innerHTML='<div class="page-title"><div><h2>Treatment Plans</h2><p>View, create and edit treatment plans for every paid service.</p></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="secondary" onclick="treatmentPlans()">↻ Refresh</button><button class="primary" onclick="openTreatmentPlan()">+ Create Treatment Plan</button></div></div><div class="panel"><div class="loading-bar"></div></div>';
  try{
    const r=await run('getTreatmentPlans',token()); window.treatmentData=r;
    const plans=r.plans||[], payments=r.payments||[];
    $('treatmentPlans').innerHTML=`<div class="page-title"><div><h2>Treatment Plans</h2><p>View, edit and resend revised plans. Frequency is optional unless the admin marks it as required.</p></div><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="secondary" onclick="treatmentPlans()">↻ Refresh</button><button class="primary" onclick="openTreatmentPlan()">+ Create Treatment Plan</button></div></div>
    <div class="panel"><h3>All Treatment Plans</h3><div class="table-wrap"><table class="table"><thead><tr><th>Patient</th><th>Service</th><th>Plan ID</th><th>Sessions</th><th>Fee / Session</th><th>Frequency</th><th>Booked</th><th>Remaining</th><th>Status</th><th>Email</th><th>Actions</th></tr></thead><tbody>
    ${plans.length?plans.map(p=>`<tr><td><b>${esc(p.name)}</b><br><small>${esc(p.email)}</small></td><td>${esc(p.service||'—')}</td><td>${esc(p.planId)}</td><td>${p.sessions}</td><td>₹${Number(p.fee||0).toLocaleString('en-IN')}</td><td>${esc(p.frequency?((p.frequency==='WEEKLY'?'Weekly':'Monthly')+(p.frequencyRequired?' · Required':' · Optional')):'No fixed frequency')}</td><td>${p.booked}</td><td><b>${p.remaining}</b></td><td>${pill(p.status)}</td><td>${pill(p.emailStatus||'PENDING')}</td><td><div style="display:flex;gap:5px;flex-wrap:wrap"><button class="secondary" onclick="viewTreatmentPlan('${esc(p.planId)}')">View</button><button class="secondary" onclick="editTreatmentPlan('${esc(p.planId)}')">Edit</button><button class="secondary" onclick="resendTreatmentPlan('${esc(p.planId)}')">Resend Email</button></div></td></tr>`).join(''):'<tr><td colspan="11">No treatment plans yet.</td></tr>'}
    </tbody></table></div></div>
    <div class="panel" style="margin-top:18px"><h3>Follow-up Payment Verification</h3><div class="table-wrap"><table class="table"><thead><tr><th>Payment ID</th><th>Patient</th><th>Service</th><th>Sessions</th><th>Amount</th><th>UTR</th><th>Status</th><th>Actions</th></tr></thead><tbody>
    ${payments.length?payments.map(p=>{const plan=plans.find(x=>x.planId===p.planId)||{};return `<tr><td>${esc(p.paymentId)}</td><td>${esc(plan.name||p.patientId)}</td><td>${esc(plan.service||'—')}</td><td>${p.sessionCount}</td><td>₹${Number(p.amount||0).toLocaleString('en-IN')}</td><td><b>${esc(p.utr||'—')}</b></td><td>${pill(p.status)}</td><td>${String(p.status).toUpperCase()==='PAYMENT PENDING'?`<button class="primary" onclick="verifyTreatment('${esc(p.paymentId)}')">Verify Payment</button> <button class="danger" onclick="rejectTreatment('${esc(p.paymentId)}')">Reject</button>`:'—'}</td></tr>`}).join(''):'<tr><td colspan="8">No follow-up payments.</td></tr>'}
    </tbody></table></div></div>`;
  }catch(e){toast(e.message||'Unable to load treatment plans.')}
}

function viewTreatmentPlan(planId){
  const p=(window.treatmentData||{}).plans?.find(x=>x.planId===planId); if(!p)return toast('Treatment plan not found.');
  $('modalBox').innerHTML=`<div class="modal-head"><div><h3>Treatment Plan</h3><p style="margin:5px 0;color:var(--muted)">${esc(p.planId)}</p></div><button class="secondary" onclick="closeModal()">Close</button></div>
  <div class="grid2"><div class="panel"><small>Patient</small><div><b>${esc(p.name)}</b><br>${esc(p.email)}<br>${esc(p.phone)}</div></div><div class="panel"><small>Service</small><div><b>${esc(p.service||'—')}</b><br>Source: ${esc(p.sourceAppointmentId)}</div></div><div class="panel"><small>Sessions</small><div><b>${p.sessions}</b> assigned · <b>${p.booked}</b> booked · <b>${p.remaining}</b> remaining</div></div><div class="panel"><small>Fee</small><div><b>₹${Number(p.fee||0).toLocaleString('en-IN')}</b> / session<br>Total ₹${Number(p.total||0).toLocaleString('en-IN')}</div></div></div>
  <div class="panel" style="margin-top:12px"><b>Frequency:</b> ${esc(p.frequency?((p.frequency==='WEEKLY'?'Weekly':'Monthly')+(p.frequencyRequired?' (Required)':' (Optional)')):'No fixed frequency')}<br><b>Duration:</b> ${esc(p.duration||'45 minutes')}<br><b>Instructions:</b> ${esc(p.notes||'None')}<br><b>Email status:</b> ${esc(p.emailStatus||'PENDING')}</div>
  <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:15px"><button class="secondary" onclick="editTreatmentPlan('${esc(p.planId)}')">Edit Plan</button><button class="primary" onclick="resendTreatmentPlan('${esc(p.planId)}')">Resend Email</button></div>`;
  $('modal').style.display='grid';
}

function editTreatmentPlan(planId){
  const p=(window.treatmentData||{}).plans?.find(x=>x.planId===planId); if(!p)return toast('Treatment plan not found.');
  $('modalBox').innerHTML=`<div class="modal-head"><div><h3>Edit Treatment Plan</h3><p style="margin:5px 0;color:var(--muted)">${esc(p.name)} · ${esc(p.service||'Physiotherapy')}</p></div><button class="secondary" onclick="closeModal()">Close</button></div>
  <div class="grid2"><div class="field"><label>Number of sessions *</label><input id="etpSessions" type="number" min="${Math.max(1,p.booked)}" max="100" value="${p.sessions}"></div><div class="field"><label>Fee per session (₹) *</label><input id="etpFee" type="number" min="1" value="${p.fee}"></div></div>
  <div class="grid2"><div class="field"><label>Frequency (optional)</label><select id="etpFrequency"><option value="">No fixed frequency</option><option value="WEEKLY" ${p.frequency==='WEEKLY'?'selected':''}>Weekly</option><option value="MONTHLY" ${p.frequency==='MONTHLY'?'selected':''}>Monthly</option></select></div><div class="field"><label>Duration</label><input id="etpDuration" value="${esc(p.duration||'45 minutes')}"></div></div>
  <div class="field"><label><input id="etpRequired" type="checkbox" ${p.frequencyRequired?'checked':''} style="width:auto;margin-right:7px"> Enforce the selected frequency as a completion requirement</label></div>
  <div class="field"><label>Notes / Instructions</label><textarea id="etpNotes" rows="4" placeholder="Optional instructions">${esc(p.notes||'')}</textarea></div>
  <div class="panel" style="background:#f4faf7">Already booked: <b>${p.booked}</b>. The number of assigned sessions cannot be reduced below this.</div>
  <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:15px"><button class="secondary" onclick="closeModal()">Cancel</button><button class="primary" onclick="saveEditedTreatmentPlan('${esc(p.planId)}')">Save & Email Patient</button></div>`;
  $('modal').style.display='grid';
}

async function saveEditedTreatmentPlan(planId){
  const frequency=$('etpFrequency').value; if($('etpRequired').checked&&!frequency)return toast('Select Weekly or Monthly before enforcing frequency.');
  try{const r=await run('editTreatmentPlan',token(),{planId:planId,sessions:Number($('etpSessions').value),fee:Number($('etpFee').value),frequency:frequency,frequencyRequired:$('etpRequired').checked,duration:$('etpDuration').value.trim(),notes:$('etpNotes').value.trim()});closeModal();toast(r.message);await treatmentPlans();}catch(e){toast(e.message||'Unable to edit treatment plan.')}
}

async function resendTreatmentPlan(planId){try{const r=await run('resendTreatmentPlanEmail',token(),planId);toast(r.message);await treatmentPlans();}catch(e){toast(e.message||'Unable to send treatment plan email.')}}

function openTreatmentPlan(sourceId){
  const source=sourceId?appts.find(x=>x.id===sourceId):null;
  const eligible=appts.filter(a=>String(a.paymentStatus||'').toUpperCase()==='PAID' && !['CANCELLED','REJECTED'].includes(String(a.status||'').toUpperCase()));
  $('modalBox').innerHTML=`<div class="modal-head"><h3>Create Follow-up Treatment Plan</h3><button class="secondary" onclick="closeModal()">Close</button></div>
    <p style="color:var(--muted)">Create a plan for <b>any paid service</b>. Frequency is optional. If the schedule must be completed within a weekly or monthly window, select a frequency and enable the requirement.</p>
    <div class="field"><label>Paid Source Appointment *</label><select id="tpSource"><option value="">Select appointment</option>${eligible.map(a=>`<option value="${esc(a.id)}" ${source&&source.id===a.id?'selected':''}>${esc(a.name)} · ${esc(a.service)} · ${formatDateLabel(a.date)} · ${esc(a.time)} · ${esc(a.id)}</option>`).join('')}</select></div>
    <div class="grid2"><div class="field"><label>Number of follow-up sessions *</label><input id="tpSessions" type="number" min="1" max="100" placeholder="e.g. 10"></div><div class="field"><label>Fee per session (₹) *</label><input id="tpFee" type="number" min="1" placeholder="e.g. 1500"></div></div>
    <div class="grid2"><div class="field"><label>Frequency (optional)</label><select id="tpFrequency"><option value="">No fixed frequency</option><option value="WEEKLY">Weekly</option><option value="MONTHLY">Monthly</option></select></div><div class="field"><label>Duration</label><input id="tpDuration" value="45 minutes"></div></div>
    <div class="field"><label><input id="tpRequired" type="checkbox" style="width:auto;margin-right:7px"> Enforce this frequency as a completion requirement</label></div>
    <div class="field"><label>Notes / Instructions</label><textarea id="tpNotes" rows="3" placeholder="Optional instructions for the patient"></textarea></div>
    <div id="tpTotal" class="panel" style="background:#f4faf7;margin:12px 0">Enter sessions and fee to calculate total.</div>
    <button class="primary" onclick="saveTreatmentPlan()">Create & Send Treatment Plan</button>`;
  $('modal').style.display='grid';
  const calc=()=>{const n=Number($('tpSessions').value||0),f=Number($('tpFee').value||0),freq=$('tpFrequency').value;$('tpTotal').innerHTML=n&&f?`<b>Total treatment plan:</b> ₹${(n*f).toLocaleString('en-IN')}<br><span style="color:var(--muted)">${n} sessions × ₹${f.toLocaleString('en-IN')} · ${freq?(freq==='WEEKLY'?'Weekly':'Monthly'):'No fixed frequency'}</span>`:'Enter sessions and fee to calculate total.'};
  $('tpSessions').addEventListener('input',calc);$('tpFee').addEventListener('input',calc);$('tpFrequency').addEventListener('change',calc);$('tpRequired').addEventListener('change',calc);
}

async function saveTreatmentPlan(){const sourceId=$('tpSource').value,n=Number($('tpSessions').value||0),fee=Number($('tpFee').value||0),frequency=$('tpFrequency').value,required=$('tpRequired').checked,notes=$('tpNotes').value.trim();if(!sourceId||!n||!fee)return toast('Select an appointment, number of sessions and fee per session.');if(required&&!frequency)return toast('Select Weekly or Monthly before enforcing frequency.');try{const r=await run('createTreatmentPlan',token(),{sourceAppointmentId:sourceId,sessions:n,fee:fee,frequency:frequency,frequencyRequired:required,duration:$('tpDuration').value.trim(),notes:notes});toast(r.message);closeModal();await treatmentPlans()}catch(e){toast(e.message)}}

function openTreatmentPaymentVerification(id){

  const r=(window.treatmentData||{}).payments||[], p=r.find(x=>String(x.paymentId)===String(id)); const plans=(window.treatmentData||{}).plans||[], plan=p?plans.find(x=>x.planId===p.planId):null;

  if(!p)return toast('Payment not found.');

  $('modalBox').innerHTML=`<div class="modal-head"><div><h3>Payment Verification</h3><p style="margin:5px 0;color:var(--muted);font-size:12px">Match the follow-up UTR with the clinic bank statement before confirming the sessions.</p></div><button class="secondary" onclick="closeModal()">Close</button></div>

    <div class="panel" style="background:#f4faf7;margin:14px 0"><small>Payment ID</small><div style="font-size:20px;font-weight:850;color:var(--teal)">${esc(p.paymentId)}</div></div>

    <div class="grid2"><div class="panel"><small>Patient</small><div><b>${esc(plan&&plan.name||p.patientId)}</b><br>${esc(plan&&plan.email||p.email)}</div></div><div class="panel"><small>Service</small><div><b>${esc(plan&&plan.service||'—')}</b></div></div><div class="panel"><small>Sessions</small><div><b>${p.sessionCount}</b></div></div><div class="panel"><small>Amount</small><div><b>₹${p.amount.toLocaleString('en-IN')}</b></div></div></div>

    <div class="panel" style="margin-top:12px"><small>Customer UTR / Transaction Reference</small><div style="font-size:18px;font-weight:800;margin-top:6px">${esc(p.utr||'NOT PROVIDED')}</div></div>

    <div class="field"><label>Admin Notes</label><textarea id="tpVerifyNotes" rows="3" placeholder="Optional verification note">Follow-up payment verified by admin</textarea></div>

    <div style="display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap"><button class="secondary" onclick="closeModal()">Cancel</button><button class="danger" onclick="rejectTreatmentFromPanel('${esc(id)}')">Reject Payment</button><button class="primary" ${p.utr?'':'disabled'} onclick="confirmTreatmentFromPanel('${esc(id)}')">✓ Verify Payment & Confirm Sessions</button></div>`;

  $('modal').style.display='grid';

}

async function confirmTreatmentFromPanel(id){const p=(window.treatmentData.payments||[]).find(x=>String(x.paymentId)===String(id));if(!p||!String(p.utr||'').trim())return toast('No UTR was submitted.');try{const r=await run('verifyTreatmentPayment',token(),id,$('tpVerifyNotes').value||'Follow-up payment verified by admin');closeModal();toast(r.message);treatmentPlans()}catch(e){toast(e.message)}}

async function rejectTreatmentFromPanel(id){try{const r=await run('rejectTreatmentPayment',token(),id,$('tpVerifyNotes')?$('tpVerifyNotes').value:'Follow-up payment rejected by admin');closeModal();toast(r.message);treatmentPlans()}catch(e){toast(e.message)}}

async function verifyTreatment(id){openTreatmentPaymentVerification(id)}

async function rejectTreatment(id){openTreatmentPaymentVerification(id)}

</script>



<style>



:root{--teal:#0f6258;--teal2:#1b7c70;--mint:#eef8f5;--gold:#caa85e;--ink:#244a46;--muted:#718985;--line:#dcebe6;--bg:#f5faf8;--red:#c95c5c;--yellow:#e0b64d;--green:#59a887}



*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}.hidden{display:none!important}



.top{background:linear-gradient(135deg,#0f6258,#1b7c70);color:white;padding:20px 28px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:10}.brand{display:flex;align-items:center;gap:14px}.brand img{width:56px;height:56px;object-fit:contain;background:white;border-radius:50%;padding:3px}.brand h1{font:700 23px Georgia,serif;margin:0}.brand small{opacity:.8}.logout{background:#fff;color:var(--teal);border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}



.login{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 10%,#dff2ec,transparent 40%),var(--bg)}.login-card{width:min(430px,92vw);background:white;border:1px solid var(--line);border-radius:24px;padding:32px;box-shadow:0 18px 60px #0f62581c}.login-card img{width:90px;height:90px;object-fit:contain;display:block;margin:auto}.login-card h2{text-align:center;font:700 28px Georgia,serif;margin:15px 0 5px}.login-card p{text-align:center;color:var(--muted)}.field{margin:13px 0}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;outline:none;background:white}.primary{background:var(--teal);color:white;border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer}.secondary{background:#edf6f3;color:var(--teal);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}.danger{background:#fff0f0;color:#a83e3e;border:1px solid #f0caca;border-radius:10px;padding:9px 12px;font-weight:700;cursor:pointer}



.app{display:none}.shell{display:grid;grid-template-columns:235px 1fr;min-height:calc(100vh - 97px)}.side{background:#fff;border-right:1px solid var(--line);padding:18px;position:sticky;top:97px;height:calc(100vh - 97px)}.nav{display:grid;gap:7px}.nav button{text-align:left;border:0;background:transparent;padding:12px;border-radius:11px;color:var(--ink);cursor:pointer;font-weight:700}.nav button.active,.nav button:hover{background:var(--mint);color:var(--teal)}.main{padding:25px;max-width:1500px;width:100%;margin:auto}.page-title{display:flex;justify-content:space-between;align-items:end;margin-bottom:20px}.page-title h2{font:700 30px Georgia,serif;margin:0}.page-title p{margin:5px 0 0;color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:15px}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:18px;box-shadow:0 6px 24px #0f625808}.stat small{color:var(--muted);font-weight:700}.stat strong{display:block;font-size:30px;margin-top:6px;color:var(--teal)}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}.panel{background:white;border:1px solid var(--line);border-radius:18px;padding:18px}.panel h3{margin:0 0 14px;font:700 19px Georgia,serif}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:11px;border-bottom:1px solid #edf3f1;text-align:left;white-space:nowrap}.table th{background:#f7fbfa;color:var(--muted);font-size:12px}.pill{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800}.pill.green{background:#e8f6ef;color:#277457}.pill.yellow{background:#fff7df;color:#916c00}.pill.red{background:#fff0f0;color:#a83e3e}.pill.gray{background:#eef0f0;color:#6b7775}

<div id="modal" class="modal"><div class="modal-box" id="modalBox"></div></div><div id="toast" class="toast"></div>



<script>



let appts=[], currentMonth=new Date().getMonth()+1,currentYear=new Date().getFullYear(),reportChart;



const $=id=>document.getElementById(id); const run=(fn,...args)=>new Promise((res,rej)=>google.script.run.withSuccessHandler(res).withFailureHandler(e=>rej(e))[fn](...args));



function toast(m){$('toast').textContent=m;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',3000)}



async function login(){
  const btn=document.querySelector('#login button[onclick="login()"]');
  if(btn){btn.disabled=true;btn.textContent='Signing in…';}
  try{
    const r=await run('verifyDoctorLogin',$('user').value.trim(),$('pass').value);
    if(!r.success){toast(r.message);return;}
    sessionStorage.setItem('bnbToken',r.token);sessionStorage.setItem('bnbDoctor',JSON.stringify(r.doctor));
    showApp();
  }catch(e){toast(e.message)}
  finally{if(btn){btn.disabled=false;btn.textContent='Sign in';}}
}



function logout(){
  sessionStorage.removeItem('bnbToken');
  sessionStorage.removeItem('bnbDoctor');
  appts=[];
  window.adminAppointmentCacheAt=0;
  if(window.jitsiApi){try{window.jitsiApi.dispose();}catch(e){} window.jitsiApi=null;}
  $('app').style.display='none';
  $('login').style.display='grid';
  $('user').value='';
  $('pass').value='';
  $('user').focus();
  window.scrollTo(0,0);
}

function currentDoctor(){try{return JSON.parse(sessionStorage.getItem('bnbDoctor')||'null')}catch(e){return null}}
function token(){return sessionStorage.getItem('bnbToken')||''}

async function showApp(){
  const d=currentDoctor();
  if(!d||!token()){ $('app').style.display='none'; $('login').style.display='grid'; return; }
  $('login').style.display='none';
  $('app').style.display='block';
  $('doctorsNav').style.display=String(d.role).toUpperCase()==='SUPER_ADMIN'?'block':'none';
  $('app').querySelector('.top small').textContent=d.name+' · '+d.role;
  // Show immediate feedback while dashboard data loads from Sheets.
  $('dashboard').innerHTML='<div class="page-title"><div><h2>Dashboard</h2><p>Loading your clinic overview…</p></div></div><div class="panel"><div class="loading-bar"></div></div>';
  loadPage('dashboard').catch(e=>toast(e.message||'Dashboard could not be loaded.'));

}

if(sessionStorage.getItem('bnbToken'))showApp();

function toggleAdminMobileMenu(force){
  const side=document.querySelector('.side'),btn=$('adminMenuToggle');
  if(!side||!btn)return;
  const open=typeof force==='boolean'?force:!side.classList.contains('mobile-open');
  side.classList.toggle('mobile-open',open);btn.classList.toggle('is-open',open);btn.setAttribute('aria-expanded',String(open));
}
 document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{loadPage(b.dataset.page);if(window.matchMedia('(max-width: 720px)').matches)toggleAdminMobileMenu(false)});

async function loadPage(page){
  if(page==='doctors'&&String((currentDoctor()||{}).role).toUpperCase()!=='SUPER_ADMIN')return toast('Super Admin access required.');
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));
  document.querySelectorAll('.view').forEach(v=>v.classList.add('hidden'));
  $(page).classList.remove('hidden');
  if(page==='dashboard')return dashboard();
  if(page==='calendar')return calendar();
  if(page==='appointments')return appointments();
  if(page==='reviews')return reviewManagement();
  if(page==='treatmentPlans')return treatmentPlans();
  if(page==='stats')return stats();
  if(page==='bills')return bills();
  if(page==='doctors')return doctors();
}



async function dashboard(){const s=await run('getDashboardSummary',token());$('dashboard').innerHTML=`<div class="page-title"><div><h2>Dashboard</h2><p>Today’s clinic overview and patient activity.</p></div></div><div class="cards"><div class="card stat"><small>Today</small><strong>${s.today}</strong></div><div class="card stat"><small>Pending payments</small><strong>${s.pendingPayments}</strong></div><div class="card stat"><small>Confirmed</small><strong>${s.confirmed}</strong></div><div class="card stat"><small>Attended</small><strong>${s.attended}</strong></div><div class="card stat"><small>Group bookings</small><strong>${s.groupBookings}</strong></div></div><div class="grid2"><div class="panel"><h3>Quick actions</h3><div style="display:flex;gap:9px;flex-wrap:wrap"><button class="primary" onclick="loadPage('calendar')">Manage slots</button><button class="secondary" onclick="loadPage('stats')">Clinic stats</button><button class="secondary" onclick="loadPage('bills')">Generate bill</button></div></div><div class="panel"><h3>Attendance rule</h3><p style="color:var(--muted);margin:0">Mark a completed patient visit as <b>ATTENDED</b>. Weekly, monthly and yearly reports use ATTENDED/COMPLETED appointments.</p></div></div>`}



async function loadAppointmentsCached(force){
  const now=Date.now();
  if(!force && appts.length && now-(window.adminAppointmentCacheAt||0)<30000) return appts;
  const box=document.querySelector('.view:not(.hidden) .page-title');
  if(box && box.querySelector('h2')) box.querySelector('h2').insertAdjacentHTML('afterend','<span id="adminLoading" class="admin-loading">Loading…</span>');
  try { appts=await run('getAppointments',token()); window.adminAppointmentCacheAt=Date.now(); return appts; }
  finally { const l=$('adminLoading'); if(l) l.remove(); }
}

function appointmentDateKey(a){
  const v=String(a.date||'').trim();
  let m=v.match(/^(\d{4})-(\d{2})-(\d{2})$/); if(m)return Number(m[1]+m[2]+m[3]);
  m=v.match(/^(\d{1,2})\s+([A-Za-z]{3,})\s+(\d{4})$/);
  if(m){const d=new Date(`${m[2]} ${m[1]}, ${m[3]} 00:00`);if(!isNaN(d))return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();}
  const d=new Date(v);return isNaN(d)?0:d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();
}
function appointmentTimeKey(a){
  const s=String(a.time||'').trim().toUpperCase();const m=s.match(/(\d{1,2}):(\d{2})\s*(AM|PM)?/);if(!m)return 0;
  let h=Number(m[1]),min=Number(m[2]);if(m[3]==='PM'&&h<12)h+=12;if(m[3]==='AM'&&h===12)h=0;return h*60+min;
}
function appointmentStatus(a){return String(a.status||'').trim().toUpperCase()}
function appointmentPayment(a){return String(a.paymentStatus||'').trim().toUpperCase()}
function appointmentSection(mode){
  const all=appts.slice();
  const pending=all.filter(a=>appointmentPayment(a).includes('PENDING')&&!['CANCELLED','REJECTED'].includes(appointmentStatus(a)));
  const upcoming=all.filter(a=>!appointmentPayment(a).includes('PENDING')&&!['CANCELLED','REJECTED','ATTENDED','COMPLETED'].includes(appointmentStatus(a)));
  const completed=all.filter(a=>['ATTENDED','COMPLETED'].includes(appointmentStatus(a)));
  const cancelled=all.filter(a=>['CANCELLED','REJECTED'].includes(appointmentStatus(a))||appointmentPayment(a)==='REJECTED');
  const asc=(a,b)=>appointmentDateKey(a)-appointmentDateKey(b)||appointmentTimeKey(a)-appointmentTimeKey(b);
  const desc=(a,b)=>appointmentDateKey(b)-appointmentDateKey(a)||appointmentTimeKey(b)-appointmentTimeKey(a);
  let list=[], title='', description='';
  if(mode==='completed'){list=completed.sort(desc);title='Appointment History';description='Attended and completed appointments, newest first.';}
  else if(mode==='cancelled'){list=cancelled.sort(desc);title='Cancelled / Rejected History';description='Cancelled appointments and rejected bookings retained for reference.';}
  else if(mode==='upcoming'){list=upcoming.sort(asc);title='Upcoming Appointments';description='Confirmed and active appointments, earliest date and time first.';}
  else {list=pending.sort((a,b)=>appointmentDateKey(a)-appointmentDateKey(b)||appointmentTimeKey(a)-appointmentTimeKey(b));title='Pending Verification';description='Payments awaiting admin approval — prioritised for action.';}
  const rows=list.map(a=>`<tr><td><b>${esc(a.name)}</b><br><small>${esc(a.email)}</small></td><td>${esc(a.service)}</td><td>${formatDateLabel(a.date)}</td><td>${esc(a.time)}</td><td>₹${esc(a.amount||'—')}</td><td><strong class="utr-cell">${esc(a.paymentReference||'NOT PROVIDED')}</strong></td><td>${pill(a.paymentStatus)}</td><td>${pill(a.status)}</td><td>${a.meetingLink?`<button class="link-button" onclick="openJitsi('${esc(a.id)}')">Join</button>`:'—'}</td><td>${a.calendarReminderStatus?`<span class="pill green">${esc(a.calendarReminderStatus)}</span>`:`<button class="secondary" onclick="syncCalendar('${esc(a.id)}')">Add 30-min reminder</button>`}</td><td><div style="display:flex;gap:5px;flex-wrap:wrap">${appointmentPayment(a).includes('PENDING')?`<button class="primary" onclick="openPaymentVerification('${esc(a.id)}')">Verify / Reject</button>`:''}${!['CANCELLED','REJECTED','ATTENDED','COMPLETED'].includes(appointmentStatus(a))?`<button class="secondary" onclick="attend('${esc(a.id)}')">Mark Attended</button>`:''}${String((currentDoctor()||{}).role).toUpperCase()==='SUPER_ADMIN'?`<button class="secondary" onclick="assignDoctor('${esc(a.id)}')">Assign Doctor</button>`:''}${appointmentPayment(a)==='PAID'&&!['CANCELLED','REJECTED'].includes(appointmentStatus(a))?`<button class="secondary" onclick="openTreatmentPlan('${esc(a.id)}')">Create Treatment Plan</button>`:''}<button class="secondary" onclick="openBill('${esc(a.id)}')">Bill</button></div></td></tr>`).join('');
