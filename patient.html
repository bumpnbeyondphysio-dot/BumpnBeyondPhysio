uto}.pill{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800;background:#eef0f0}.pill.green{background:#e8f6ef;color:#277457}.pill.yellow{background:#fff7df;color:#916c00}.pill.red{background:#fff0f0;color:#a83e3e}.plan-head{display:flex;justify-content:space-between;gap:20px;align-items:start}.actions{display:flex;gap:8px;flex-wrap:wrap}.modal{position:fixed;inset:0;background:#153f3a55;display:none;place-items:center;padding:15px;z-index:20}.modal.open{display:grid}.modal-box{width:min(720px,96vw);max-height:92vh;overflow:auto;background:#fff;border-radius:22px;padding:24px}.session-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;margin:8px 0}.qr{display:block;width:min(280px,80vw);margin:18px auto;border:1px solid var(--line);border-radius:14px}.pay-box{background:var(--mint);border:1px solid var(--line);border-radius:15px;padding:16px;margin:15px 0}.msg{padding:11px;border-radius:10px;margin-top:10px}.success{background:#e8f6ef;color:#277457}.error{background:#fff0f0;color:#a83e3e}@media(max-width:750px){.grid{grid-template-columns:1fr}.top{align-items:flex-start}.session-row{grid-template-columns:1fr}.table{min-width:700px}}

</head><body><div id="login" class="login"><div class="brand"><img src="https://drive.google.com/thumbnail?id=1TqpPo05Q6_XFUj-CYmgBzIUfsipYR30n&sz=w600"><div><h1>Bump N Beyond Physio</h1><p class="muted">Patient Portal · My Bookings</p></div></div><h2 style="margin-top:25px">My Bookings</h2><p class="muted">Sign in securely with an OTP sent to your registered email address.</p><div class="field"><label>Registered Email Address</label><input id="identifier" placeholder="Enter your registered email address"></div><button class="btn primary" style="width:100%" onclick="sendOtp()">Send OTP</button><div id="loginMsg"></div><div id="otpArea" class="hidden"><div class="field"><label>Enter OTP</label><input id="otp" inputmode="numeric" maxlength="6" placeholder="6-digit OTP"></div><button class="btn primary" style="width:100%" onclick="verifyOtp()">Verify & Continue</button></div></div><div id="app" class="hidden"><div class="wrap"><header class="top"><div class="brand"><img src="https://drive.google.com/thumbnail?id=1TqpPo05Q6_XFUj-CYmgBzIUfsipYR30n&sz=w600"><div><h1>Bump N Beyond Physio</h1><p>My Bookings & Treatment Plans</p></div></div><div><button class="btn light" onclick="logout()">Logout</button></div></header><div id="content"></div></div></div><div id="modal" class="modal"><div class="modal-box" id="modalBox"></div></div><script>
let pt=null,portal=null;const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function msg(id,t,ok){$(id).innerHTML='<div class="msg '+(ok?'success':'error')+'>'+esc(t)+'</div>'}function sendOtp(){const x=$('identifier').value.trim().toLowerCase();if(!x)return msg('loginMsg','Enter your registered email address.',false);if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(x))return msg('loginMsg','Enter a valid email address.',false);google.script.run.withSuccessHandler(r=>{$('otpArea').classList.remove('hidden');msg('loginMsg',r.message,true)}).withFailureHandler(e=>msg('loginMsg',e.message,false)).requestPatientOtp(x)}
function verifyOtp(){const email=$('identifier').value.trim().toLowerCase(),otp=$('otp').value.trim();if(!otp)return msg('loginMsg','Enter the OTP sent to your email.',false);google.script.run.withSuccessHandler(r=>{pt=r;sessionStorage.setItem('bnbPatientToken',r.token);loadPortal()}).withFailureHandler(e=>msg('loginMsg',e.message,false)).verifyPatientOtp(email,otp)}
function loadPortal(){google.script.run.withSuccessHandler(r=>{portal=r;$('login').classList.add('hidden');$('app').classList.remove('hidden');render()}).withFailureHandler(e=>{sessionStorage.removeItem('bnbPatientToken');msg('loginMsg',e.message,false)}).getPatientPortal(pt.token)}function render(){
  const p=portal.patient, plans=portal.plans||[], ap=portal.appointments||[];
  $('content').innerHTML='<div class="grid"><div class="card"><small>Patient ID</small><div class="big">'+esc(p.patientId)+'</div></div><div class="card"><small>Patient</small><div class="big">'+esc(p.name)+'</div></div><div class="card"><small>Registered Email</small><div style="margin-top:8px">'+esc(p.email)+'</div></div></div>'+
  '<div class="section"><div class="section-title"><div><h2>My Treatment Plans</h2><p class="muted">Follow-up plans created by your physiotherapist for any service.</p></div></div>'+(
    plans.length?plans.map(plan=>'<div class="card" style="margin-bottom:12px"><div class="plan-head"><div><h3>'+esc(plan.service||'Physiotherapy Follow-up')+'</h3><p class="muted">Plan ID: '+esc(plan.planId)+'</p></div><span class="pill green">'+esc(plan.status)+'</span></div><div class="grid"><div><small>Sessions</small><div class="big">'+plan.sessions+'</div></div><div><small>Fee / session</small><div class="big">₹'+plan.fee.toLocaleString('en-IN')+'</div></div><div><small>Remaining</small><div class="big">'+plan.remaining+'</div></div></div><div style="margin-top:12px;color:var(--muted);font-size:13px"><b>Frequency:</b> '+esc(plan.frequency)+' &nbsp; · &nbsp; <b>Duration:</b> '+plan.duration+' min'+(plan.notes?' &nbsp; · &nbsp; <b>Notes:</b> '+esc(plan.notes): '')+'</div><div class="actions" style="margin-top:15px">'+(plan.remaining>0?'<button class="btn primary" onclick="openBook(\''+esc(plan.planId)+'\')">Book Follow-up Sessions</button>':'')+'</div></div>').join(''):
    '<div class="card"><b>No active treatment plan.</b><p class="muted">Your physiotherapist can create a follow-up plan after any paid service.</p></div>')+'</div>'+
  '<div class="section"><div class="section-title"><div><h2>My Bookings</h2><p class="muted">Appointments, date, time, payment status and Jitsi links.</p></div></div><div class="card table-wrap"><table class="table"><thead><tr><th>Booking ID</th><th>Service</th><th>Date</th><th>Time</th><th>Amount</th><th>Payment</th><th>Status</th><th>Jitsi</th></tr></thead><tbody>'+(
    ap.length?ap.map(a=>'<tr><td><b>'+esc(a.id)+'</b></td><td>'+esc(a.service)+'</td><td>'+esc(a.date)+'</td><td>'+esc(a.time)+'</td><td>₹'+esc(a.amount)+'</td><td><span class="pill '+(String(a.paymentStatus).toUpperCase()==='PAID'?'green':'yellow')+'">'+esc(a.paymentStatus)+'</span></td><td>'+esc(a.status)+'</td><td>'+(a.meetingLink?'<a href="'+esc(a.meetingLink)+'" target="_blank">Join Jitsi</a>':'—')+'</td></tr>').join(''):'<tr><td colspan="8">No bookings yet.</td></tr>')+'</tbody></table></div></div>';
}

function openBook(planId){
  const plan=portal.plans.find(x=>x.planId===planId);if(!plan)return;activePlan=plan;
  const max=plan.remaining;let opts='';
  for(let n=1;n<=max;n++)opts+='<option value="'+n+'" '+(n===Math.min(2,max)?'selected':'')+'>'+n+' session'+(n>1?'s':'')+'</option>';
  $('modalBox').innerHTML='<h2>Book Follow-up Sessions</h2><p class="muted"><b>Service:</b> '+esc(plan.service)+'<br><b>Frequency:</b> '+esc(plan.frequency)+' · <b>Duration:</b> '+esc(plan.duration||'45 minutes')+' per session</p><div class="field"><label>Sessions in this payment batch</label><select id="weeklyCount">'+opts+'</select></div><div id="sessionRows"></div><div class="pay-box"><b>Fee per session:</b> ₹'+plan.fee.toLocaleString('en-IN')+'<br><b>Selected sessions:</b> <span id="count">2</span><br><b>Amount payable:</b> ₹<span id="total">'+(Math.min(2,max)*plan.fee).toLocaleString('en-IN')+'</span></div>'+(BNB_UPI_QR_DATA_URL ? '<img class="qr" src="'+esc(BNB_UPI_QR_DATA_URL)+'" alt="Clinic UPI QR"><p class="muted" style="text-align:center">Pay the displayed amount using your UPI app. The QR has no prefilled amount.</p>' : '<div class="pay-box"><b>Payment instructions</b><p class="muted">Use the clinic-approved UPI QR/payment details provided by the clinic, then enter the transaction reference below. The QR has not yet been configured in this portal.</p></div>')+'<div class="field"><label>UTR / Transaction Reference *</label><input id="utr" placeholder="Enter UTR after payment"></div><div class="actions"><button class="btn light" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="submitPlanBooking(\''+esc(planId)+'\')">Submit Payment & Book</button></div><div id="bookMsg"></div>';
  $('modal').classList.add('open');
  function build(n){let html='';for(let i=0;i<n;i++)html+='<div class="session-row"><div class="field"><label>Session '+(i+1)+' date</label><input type="date" id="sd'+i+'" min="'+new Date().toISOString().slice(0,10)+'"></div><div class="field"><label>Time</label><select id="st'+i+'"><option value="">Select date first</option></select></div></div>';$('sessionRows').innerHTML=html;for(let i=0;i<n;i++)$('sd'+i).addEventListener('change',()=>loadTimes(i));$('count').textContent=n;$('total').textContent=(n*plan.fee).toLocaleString('en-IN')}
  $('weeklyCount').addEventListener('change',()=>build(Number($('weeklyCount').value)));build(Math.min(2,max));
}
function loadTimes(i){const d=$('sd'+i).value;if(!d||!activePlan)return;google.script.run.withSuccessHandler(slots=>{$('st'+i).innerHTML='<option value="">Select time</option>'+slots.filter(s=>String(s.status||'').toUpperCase()==='AVAILABLE').map(s=>'<option value="'+esc(s.time)+'">'+esc(s.label||s.time)+(s.remaining!=null?' · '+s.remaining+' seats left':'')+'</option>').join('')}).withFailureHandler(e=>msg('bookMsg',e.message,false)).getAvailableSlots(d,activePlan.service)}
function submitPlanBooking(planId){const plan=portal.plans.find(x=>x.planId===planId),n=Number($('weeklyCount').value),entries=[];for(let i=0;i<n;i++){const d=$('sd'+i).value,t=$('st'+i).value;if(!d||!t)return msg('bookMsg','Select a date and time for every session.',false);entries.push({date:d,time:t})}const utr=$('utr').value.trim();if(!utr)return msg('bookMsg','Enter the UTR after payment.',false);google.script.run.withSuccessHandler(r=>{msg('bookMsg',r.message,true);setTimeout(()=>{closeModal();loadPortal()},1200)}).withFailureHandler(e=>msg('bookMsg',e.message,false)).bookTreatmentSessions(pt.token,{planId:planId,sessions:entries,paymentReference:utr})}
function closeModal(){$('modal').classList.remove('open');$('modalBox').innerHTML=''}function logout(){sessionStorage.removeItem('bnbPatientToken');pt=null;portal=null;activePlan=null;closeModal();$('app').classList.add('hidden');$('login').classList.remove('hidden');$('identifier').value='';$('otp').value='';$('otpArea').classList.add('hidden');$('loginMsg').innerHTML='';window.scrollTo(0,0);$('identifier').focus()}
</script></body></html>
