
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#123d35">
  <title>Bump N Beyond Physio</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: #183a32;
      background: linear-gradient(135deg, #f4fbf7, #e3f1eb);
    }
    main {
      width: 100%;
      max-width: 650px;
      padding: 40px 28px;
      text-align: center;
      background: white;
      border-radius: 22px;
      box-shadow: 0 15px 45px #123d3518;
    }
    .logo {
      width: 74px;
      height: 74px;
      display: grid;
      place-items: center;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: #e2f2e9;
      font-size: 35px;
    }
    h1 { margin-bottom: 10px; font-size: clamp(27px, 5vw, 38px); }
    p { color: #59716a; line-height: 1.7; }
    a {
      display: inline-block;
      margin-top: 16px;
      padding: 14px 22px;
      border-radius: 10px;
      color: white;
      background: #176b52;
      text-decoration: none;
      font-weight: bold;
    }
    a:hover { background: #10543f; }
    small { display: block; margin-top: 24px; color: #71837c; }
  </style>
</head>
<body>
  <main>
    <div class="logo" aria-hidden="true">🌿</div>

</html>
